<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix - Registration | Mariam Emad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="registration.css">

</head>

<body>

<div class="login-page">

    <a href="index.html" class="login-logo">NETFLIX</a>

    <div class="login-box">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input

                type="text"

                id="username"

                class="form-control"

                placeholder="Username"

                required>

            <input

                type="email"

                id="email"

                class="form-control"

                placeholder="Email Address"

                required>

            <input

                type="password"

                id="password"

                class="form-control"

                placeholder="Password"

                required minlength="6">

            <button type="submit" class="register-btn">

                REGISTER

            </button>

            <p id="registerMessage"></p>

        </form>

        <p class="account-link">

            Already have an account?

            <a href="login.html">Login</a>

        </p>

    </div>

    <p class="designer">Mariam Emad</p>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value;

    const message = document.getElementById("registerMessage");

    if (username.length >= 3) {

        message.textContent = "Registration submitted successfully!";

        message.style.color = "#46d369";

    } else {

        message.textContent = "Please enter a valid username.";

        message.style.color = "#e50914";

    }

});

</script>

</body>

</html>
